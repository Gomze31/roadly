# Publie une release installable par la mise à jour intégrée de Roadly (Réglages › Mises à jour).
# Déclenchement : chaque push sur main (version 0.1.<nombre de commits>), un tag « v0.2.0 », ou le workflow lancé à la main.
# Secrets requis (Settings › Secrets and variables › Actions) : ROADLY_KEYSTORE_BASE64, ROADLY_KEYSTORE_PASSWORD,
# ROADLY_KEY_ALIAS, ROADLY_KEY_PASSWORD — voir docs/UPDATES.md.
name: Release Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 0.2.0) ; le tag v<version> est créé'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions épinglées à un commit (une étiquette « v4 » peut être déplacée) ; mettre à jour en connaissance de cause.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # versionCode = nombre de commits : l'historique complet est nécessaire

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK préinstallé sur ubuntu-latest (setup-android@v3 échoue sur l'invite de licences de cmdline-tools 16).
      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Version
        id: v
        # Saisie manuelle passée par l'environnement, jamais recopiée dans le script (pas d'injection de commande).
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          CODE=$(git rev-list --count HEAD)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then V="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="0.1.$CODE"   # push sur main : même versionName qu'une compilation locale du même commit
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "::error::Version invalide : $V"; exit 1; }
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest :core:model:test :core:common:test :core:scooter:test --stacktrace

      # Clé décodée seulement après les tests : le code des tests et de leurs dépendances ne la voit jamais.
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ROADLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ROADLY_KEYSTORE_BASE64 absent : sans la clé, Android refuserait la mise à jour (docs/UPDATES.md)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/roadly.jks"

      - name: APK signé
        env:
          ROADLY_KEYSTORE: ${{ runner.temp }}/roadly.jks
          ROADLY_KEYSTORE_PASSWORD: ${{ secrets.ROADLY_KEYSTORE_PASSWORD }}
          ROADLY_KEY_ALIAS: ${{ secrets.ROADLY_KEY_ALIAS }}
          ROADLY_KEY_PASSWORD: ${{ secrets.ROADLY_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Proadly.versionCode=${{ steps.v.outputs.code }} -Proadly.versionName=${{ steps.v.outputs.name }} --stacktrace

      - name: Manifeste de mise à jour
        run: |
          APK="roadly-${{ steps.v.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","apk":"%s","sha256":"%s","minSdk":29}\n' \
            "${{ steps.v.outputs.code }}" "${{ steps.v.outputs.name }}" "$APK" "$SHA" > update.json
          cat update.json

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Roadly ${{ steps.v.outputs.name }}
          generate_release_notes: true
          files: |
            roadly-${{ steps.v.outputs.name }}.apk
            update.json

      - name: Nettoyage
        if: always()
        run: rm -f "$RUNNER_TEMP/roadly.jks"
