# Publie une release installable par la mise à jour intégrée de Roadly (Réglages › Mises à jour).
# Déclenchement : chaque push sur main, un tag « v1.2.3 » posé sur un commit de main, ou le workflow lancé à la main depuis main.
# Nom de version d'un push sur main : calculé par Gradle (:app:printRoadlyVersion), donc identique à une compilation locale
# du même commit — « 0.1.<commits> », ou « 1.0.<commits − base> » dès que roadly.versionBase est renseigné (gradle.properties).
# Secrets requis, à placer dans l'environnement protégé « release » (Settings › Environments) : ROADLY_KEYSTORE_BASE64,
# ROADLY_KEYSTORE_PASSWORD, ROADLY_KEY_ALIAS, ROADLY_KEY_PASSWORD. Variable requise : ROADLY_SIGNER_SHA256, empreinte SHA-256 du
# certificat de publication (information publique). Voir docs/SIGNATURE.md.
#
# Ce workflow n'a aucun déclencheur « pull_request » : le code d'une contribution n'approche jamais la clé. Les contributions
# sont vérifiées par .github/workflows/ci.yml, sans secret. Une fusion dans main déclenche ce workflow, mais la tâche « sign »
# attend l'approbation du propriétaire tant que l'environnement « release » exige un relecteur (réglage du dépôt).
#
# Trois tâches, du moins au plus privilégié (SEC-2) :
#   build   — lecture seule, aucun secret : tests et APK non signé. Tout le code tiers (Gradle, plugins, dépendances) s'exécute ici.
#   sign    — seule tâche qui voit la clé ; elle n'exécute que zipalign et apksigner du SDK, jamais Gradle.
#   publish — seule tâche qui peut écrire dans le dépôt ; elle ne voit pas la clé.
name: Release Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 1.0.0) ; le tag v<version> est créé. Vide : nom calculé comme pour un push. À lancer depuis main.'
        required: false

# Aucun droit par défaut : chaque tâche déclare les siens.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      # Actions épinglées à un commit (une étiquette « v4 » peut être déplacée) ; mettre à jour en connaissance de cause.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0               # versionCode = nombre de commits ; origin/main sert au contrôle de référence
          persist-credentials: false   # le jeton du dépôt n'est pas laissé dans .git/config à la portée du build

      # REL-3 : seul un commit de main peut devenir « latest ». Un lancement manuel depuis une autre branche, ou un tag posé
      # sur un commit absent de main, est refusé avant toute compilation. Sans réseau : origin/main vient du checkout complet.
      - name: Référence autorisée
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Lancement manuel refusé depuis $REF : une release ne se publie que depuis main."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Le commit $(git rev-parse --short HEAD) n'appartient pas à main : release refusée."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK préinstallé sur ubuntu-latest (setup-android@v3 échoue sur l'invite de licences de cmdline-tools 16).
      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Le gradle-wrapper.jar du dépôt doit être une version officielle de Gradle, avant sa première exécution.
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Version
        id: v
        # Saisie manuelle passée par l'environnement, jamais recopiée dans le script (pas d'injection de commande).
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          CODE=$(git rev-list --count HEAD)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else
            # Push sur main : une seule formule, celle de app/build.gradle.kts.
            LINE=$(./gradlew -q :app:printRoadlyVersion | grep '^roadlyVersion ')
            V=$(echo "$LINE" | sed -n 's/^roadlyVersion code=[0-9]* name=//p')
            GRADLE_CODE=$(echo "$LINE" | sed -n 's/^roadlyVersion code=\([0-9]*\) .*/\1/p')
            if [ "$GRADLE_CODE" != "$CODE" ]; then
              echo "::error::versionCode Gradle ($GRADLE_CODE) différent du nombre de commits ($CODE)."
              exit 1
            fi
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "::error::Version invalide : $V"; exit 1; }
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # REL-1 : la mise à jour intégrée ne propose qu'un versionCode strictement supérieur. Une release dont le code ne dépasse
      # pas celui de la dernière publiée (tag posé sur un commit déjà publié, relance manuelle) ne serait jamais installée ;
      # un nom qui recule (0.1.N après 1.0.0) tromperait l'utilisateur. Les deux cas sont refusés avant de compiler.
      - name: Version strictement croissante
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.v.outputs.code }}
          NAME: ${{ steps.v.outputs.name }}
        run: |
          if ! LATEST_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> latest.err); then
            if grep -q 'HTTP 404' latest.err; then
              echo "Aucune release publiée : rien à comparer."
              exit 0
            fi
            cat latest.err
            echo "::error::Dernière release illisible : impossible de vérifier que la version progresse."
            exit 1
          fi
          if ! gh release download "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --pattern update.json --output latest-update.json; then
            echo "::error::La release $LATEST_TAG n'a pas de update.json : impossible de vérifier que la version progresse."
            exit 1
          fi
          LATEST_CODE=$(jq -r '.versionCode' latest-update.json)
          LATEST_NAME=$(jq -r '.versionName' latest-update.json)
          rm -f latest-update.json latest.err
          echo "Dernière release : $LATEST_NAME (versionCode $LATEST_CODE) ; celle-ci : $NAME (versionCode $CODE)."
          if ! [ "$CODE" -gt "$LATEST_CODE" ]; then
            echo "::error::versionCode $CODE ≤ $LATEST_CODE ($LATEST_TAG) : les appareils ne recevraient jamais cette version. Publier depuis un commit plus récent."
            exit 1
          fi
          HIGHEST=$(printf '%s\n%s\n' "$LATEST_NAME" "$NAME" | sort -V | tail -n 1)
          if [ "$NAME" = "$LATEST_NAME" ] || [ "$HIGHEST" != "$NAME" ]; then
            echo "::error::Le nom $NAME ne suit pas $LATEST_NAME : renseigner roadly.versionBase (gradle.properties) ou choisir une version supérieure."
            exit 1
          fi

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest :core:model:test :core:common:test :core:scooter:test :core:radar:test --stacktrace

      # Sans clé dans l'environnement, la variante release sort non signée (app/build.gradle.kts) : la clé n'entre jamais ici.
      - name: APK non signé
        env:
          CODE: ${{ steps.v.outputs.code }}
          NAME: ${{ steps.v.outputs.name }}
        run: ./gradlew :app:assembleRelease "-Proadly.versionCode=$CODE" "-Proadly.versionName=$NAME" --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    # Environnement protégé : les secrets de signature y sont rangés, et un relecteur obligatoire (le propriétaire) y est
    # configuré dans les réglages du dépôt. Sans cette protection, toute fusion dans main serait signée sans validation.
    environment: release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-unsigned

      - name: Signature
        env:
          KEYSTORE_B64: ${{ secrets.ROADLY_KEYSTORE_BASE64 }}
          ROADLY_KEYSTORE_PASSWORD: ${{ secrets.ROADLY_KEYSTORE_PASSWORD }}
          ROADLY_KEY_ALIAS: ${{ secrets.ROADLY_KEY_ALIAS }}
          ROADLY_KEY_PASSWORD: ${{ secrets.ROADLY_KEY_PASSWORD }}
          EXPECTED_SIGNER_SHA256: ${{ vars.ROADLY_SIGNER_SHA256 }}
          COMMIT: ${{ github.sha }}
          CODE: ${{ needs.build.outputs.code }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ROADLY_KEYSTORE_BASE64 absent : sans la clé, Android refuserait la mise à jour (docs/UPDATES.md)."
            exit 1
          fi
          KS="$RUNNER_TEMP/roadly.jks"
          trap 'rm -f "$KS"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK="roadly-$NAME.apk"
          # L'APK produit par Gradle est déjà aligné ; la signature v2+ exige qu'il le soit avant d'être signé.
          "$BUILD_TOOLS/zipalign" -c 4 app-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KS" --ks-key-alias "$ROADLY_KEY_ALIAS" \
            --ks-pass env:ROADLY_KEYSTORE_PASSWORD --key-pass env:ROADLY_KEY_PASSWORD \
            --out "$APK" app-release-unsigned.apk
          # Vérification complète de l'APK signé, pour la plus ancienne version d'Android prise en charge (échec = arrêt).
          "$BUILD_TOOLS/apksigner" verify --min-sdk-version 29 "$APK"
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          # Le préfixe des lignes dépend de la version d'apksigner (« Signer #1 … », « V3.0 Signer: … » avec build-tools 37) :
          # seule la fin de ligne est lue. Les certificats sont publics : la sortie complète est journalisée.
          echo "$CERTS"
          DN=$(echo "$CERTS" | sed -n 's/^.*certificate DN: //p' | sort -u)
          SIGNER=$(echo "$CERTS" | sed -n 's/^.*certificate SHA-256 digest: //p' | tr 'A-F' 'a-f' | sort -u)
          if [ "$(echo "$SIGNER" | grep -c .)" != "1" ]; then
            echo "::error::Un seul certificat de signature est attendu ; trouvé : $(echo "$SIGNER" | grep -c .)."
            exit 1
          fi
          # Jamais de version publiée avec une clé de développement : son mot de passe est public (« android »).
          case "$DN" in
            *"CN=Android Debug"*)
              echo "::error::L'APK est signé avec une clé de debug Android : publication refusée (docs/SIGNATURE.md)."
              exit 1 ;;
          esac
          # Identité de signature constante : le certificat doit être celui déclaré dans les réglages du dépôt.
          EXPECTED=$(echo "$EXPECTED_SIGNER_SHA256" | tr -d ': \r\n' | tr 'A-F' 'a-f')
          if [ -z "$EXPECTED" ]; then
            echo "::error::Variable ROADLY_SIGNER_SHA256 absente : l'empreinte du certificat de publication doit être déclarée (docs/SIGNATURE.md)."
            exit 1
          fi
          if [ "$SIGNER" != "$EXPECTED" ]; then
            echo "::error::Certificat de signature inattendu ($SIGNER) : ce n'est pas la clé de publication déclarée."
            exit 1
          fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","apk":"%s","sha256":"%s","minSdk":29,"signerSha256":"%s"}\n' "$CODE" "$NAME" "$APK" "$SHA" "$SIGNER" > update.json
          cat update.json
          sha256sum "$APK" update.json > SHA256SUMS.txt
          {
            echo "## Vérifier ce téléchargement"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Fichier | \`$APK\` |"
            echo "| SHA-256 du fichier | \`$SHA\` |"
            echo "| SHA-256 du certificat de signature | \`$SIGNER\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo
            echo "Le certificat doit être celui publié dans \`docs/SIGNATURE.md\`. Commandes de vérification : même document."
            echo
          } > notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            roadly-${{ needs.build.outputs.name }}.apk
            update.json
            SHA256SUMS.txt
            notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Roadly ${{ needs.build.outputs.name }}
          # Bloc de vérification (empreintes) suivi des notes générées depuis les commits.
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            roadly-${{ needs.build.outputs.name }}.apk
            update.json
            SHA256SUMS.txt
